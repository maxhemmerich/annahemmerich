<script>
(() => {
  const W = [{"src": "../assets/art/tennis-1600.jpg", "webp": "../assets/art/tennis-1600.webp", "cap": "Tennis Acrylic and collage on canvas 46 × 36 in, 2025"}, {"src": "../assets/art/since-daisies-1600.jpg", "webp": "../assets/art/since-daisies-1600.webp", "cap": "Since daisies Acrylic on canvas 24 × 18 in, 2026"}, {"src": "../assets/art/pear-juice-1600.jpg", "webp": "../assets/art/pear-juice-1600.webp", "cap": "Pear juice Acrylic on canvas 60 × 60 in, 2026"}, {"src": "../assets/art/sunset-florida-man-1600.jpg", "webp": "../assets/art/sunset-florida-man-1600.webp", "cap": "Sunset florida man Oil on canvas 40 × 30 in, 2026"}, {"src": "../assets/art/personal-highway-1600.jpg", "webp": "../assets/art/personal-highway-1600.webp", "cap": "Personal highway Acrylic and collaged wood on panel 40 × 19 in, 2025"}, {"src": "../assets/art/sounding-yellow-bell-1600.jpg", "webp": "../assets/art/sounding-yellow-bell-1600.webp", "cap": "Sounding yellow bell Acrylic and collaged wood on panel 48 × 36 in, 2026"}, {"src": "../assets/art/entry-line-1600.jpg", "webp": "../assets/art/entry-line-1600.webp", "cap": "Entry line Acrylic and collage on wood panel 39 × 24 in, 2025"}, {"src": "../assets/art/buster-1600.jpg", "webp": "../assets/art/buster-1600.webp", "cap": "Buster Acrylic, mixed media, and wood collage on panel 21 × 14 in, 2025"}, {"src": "../assets/art/garbage-collector-1600.jpg", "webp": "../assets/art/garbage-collector-1600.webp", "cap": "Garbage Collector (diptych) Oil on panel 42 × 36 in, 2026"}, {"src": "../assets/art/sesick-1600.jpg", "webp": "../assets/art/sesick-1600.webp", "cap": "Sesick Acrylic and collaged wood on panel 40 × 40 in, 2025"}, {"src": "../assets/art/wonder-bus-1600.jpg", "webp": "../assets/art/wonder-bus-1600.webp", "cap": "Wonder bus (diptych) Acrylic on panel 47 × 38 in, 2026"}, {"src": "../assets/art/jarvis-tea-1600.jpg", "webp": "../assets/art/jarvis-tea-1600.webp", "cap": "Jarvis Tea Acrylic and collage on canvas 60 × 48 in, 2025"}, {"src": "../assets/art/machine-for-wilting-1600.jpg", "webp": "../assets/art/machine-for-wilting-1600.webp", "cap": "Machine for wilting Acrylic on wood 19 × 16 in, 2026"}, {"src": "../assets/art/electric-fence-1600.jpg", "webp": "../assets/art/electric-fence-1600.webp", "cap": "Electric fence Acrylic on canvas 40 × 30 in, 2026"}, {"src": "../assets/art/hive-knot-1600.jpg", "webp": "../assets/art/hive-knot-1600.webp", "cap": "Hive knot Acrylic on canvas 62 × 50 in, 2026"}, {"src": "../assets/art/depot-drawers-1600.jpg", "webp": "../assets/art/depot-drawers-1600.webp", "cap": "Depot drawers Acrylic and collage on canvas 48 × 36 in, 2025"}, {"src": "../assets/art/sweetie-snow-cap-1600.jpg", "webp": "../assets/art/sweetie-snow-cap-1600.webp", "cap": "Sweetie snow cap Acrylic on wood 42 × 40 in, 2026"}, {"src": "../assets/art/huckleberry-bush-1600.jpg", "webp": "../assets/art/huckleberry-bush-1600.webp", "cap": "Huckleberry bush Acrylic on wood 32 × 25 in, 2026"}, {"src": "../assets/art/purple-propeller-1600.jpg", "webp": "../assets/art/purple-propeller-1600.webp", "cap": "Purple propeller Acrylic on canvas 48 × 48 in, 2026"}, {"src": "../assets/art/gosha-1600.jpg", "webp": "../assets/art/gosha-1600.webp", "cap": "Gosha Acrylic on panel 24 × 18 in, 2025"}];
  const ov = document.getElementById("overlay");
  const img = document.getElementById("ov-img");
  const src = document.getElementById("ov-src");
  const cap = document.getElementById("ov-cap");
  let cur = -1;
  function show(i) {
    cur = (i + W.length) % W.length;
    img.src = W[cur].src;
    src.srcset = W[cur].webp;
    img.alt = W[cur].cap;
    cap.textContent = W[cur].cap;
    ov.hidden = false;
    document.body.classList.add("locked");
  }
  function hide() {
    ov.hidden = true;
    document.body.classList.remove("locked");
  }
  document.querySelectorAll(".tile").forEach((b, i) =>
    b.addEventListener("click", () => show(i)));
  document.querySelector(".overlay__x").addEventListener("click", hide);
  document.querySelector(".overlay__prev").addEventListener("click", () => show(cur - 1));
  document.querySelector(".overlay__next").addEventListener("click", () => show(cur + 1));
  document.addEventListener("keydown", (e) => {
    if (ov.hidden) return;
    if (e.key === "Escape") hide();
    else if (e.key === "ArrowLeft") show(cur - 1);
    else if (e.key === "ArrowRight") show(cur + 1);
  });
})();
</script>
